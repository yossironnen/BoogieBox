[workspace]
members = [".", "crates/boogiebox-audio"]

[package]
name = "boogiebox-desktop"
version = "0.9.120"
edition = "2021"

[lib]
name = "boogiebox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.13", features = ["json"], default-features = false, optional = true }
uuid = { version = "1", features = ["v4"] }
directories = "6"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
boogiebox-audio = { path = "crates/boogiebox-audio" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Media",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["health-probe"]
health-probe = ["reqwest"]

[profile.release]
opt-level = "s"
panic = "abort"
codegen-units = 1
lto = true
strip = true



